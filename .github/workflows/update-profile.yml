name: Refresh profile cards

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.json
      - scripts/**
      - fonts/**
      - .github/workflows/update-profile.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Refresh public data
        run: python scripts/update_data.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Render cards
        run: python scripts/render_cards.py
      - name: Commit changed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data README.md preview.html
          if ! git diff --cached --quiet; then
            git commit -m "Refresh profile cards"
            git push
          fi
